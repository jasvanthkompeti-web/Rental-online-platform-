<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentX Electronics Rental</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a class="logo">RentX</a><div><a href="#products">Electronics</a><a href="#cart">Cart 🛒 <b id="count">0</b></a></div></nav>
<header><div><span>ONLINE ELECTRONICS RENTAL</span><h1>Rent the electronics<br>you need.</h1><p>Laptops, iPhones, cameras, tablets and gaming devices.</p><a class="btn" href="#products">Shop Now</a></div></header>

<section id="products" class="section"><div class="title"><h2>Available Electronics</h2><input id="search" placeholder="Search electronics..."></div><div class="cats">
<button onclick="showAll()">All</button><button onclick="filter('Laptop')">Laptops</button><button onclick="filter('Phone')">iPhones</button><button onclick="filter('Camera')">Cameras</button><button onclick="filter('Tablet')">Tablets</button>
</div><div id="products" class="grid"></div></section>

<section id="cart" class="section cartSection"><h2>Your Cart</h2><div id="cartItems"></div><div id="cartTotal"></div></section>

<section id="checkout" class="checkout section"><div class="box"><h2>Rental Checkout</h2>
<input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email">
<input id="phone" placeholder="Phone number"><label>Rental start date</label><input id="start" type="date"><label>Rental end date</label><input id="end" type="date">
<h3 id="estimate">Choose dates to see total</h3><button class="pay" onclick="payNow()">💳 Pay Now</button><p id="paymentMsg"></p></div>
<div class="box"><h2>Bill</h2><div id="bill"><p>Add products to your cart.</p></div></div></section>
<footer>© 2026 RentX Electronics Rental</footer>
<script src="app.js"></script></body></html>
